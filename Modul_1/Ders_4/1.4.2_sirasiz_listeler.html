 <h1>Sırasız Listeler</h1>

<!-- Sıtasız listelerde type parametrisinin görevi CSS'e devedilmiştir-->
<!-- CSS ile madde işaretini değiştirne yöntemini aşağıdaki kodda kullandık.-->
<!-- Madde işaretini değiştirmek için disc,square,circle kullanılır.-->
<!-- Madde işaretini kaldırmak için none kullanılır. -->
<ul style="list-style-type: circle;"> 
<li>Yumurta</li>
<li>Süt</li>
<li>Ekmek</li>
</ul>

<!--Hızlı liste eklemek içim ul>*5 yazabilirsiniz. -->
